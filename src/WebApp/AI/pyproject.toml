[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-api"
version = "1.0.0"
description = "FastAPI service (AgenticAI API skeleton)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.34.0",

    "pyodbc==5.2.0",

    "python-jose==3.4.0",

    "python-dotenv==1.0.1",

    "hypercorn==0.16.0",
    "gunicorn",

    "langgraph==0.2.76",
    "langchain==0.3.25",
    "langchain-core==0.3.68",
    "langchain-openai==0.3.25",

    "google-api-python-client==2.166.0",
    "google-auth==2.38.0",

    "python-dateutil==2.9.0.post0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "utils", "mail_graph"]
