name: CI - WebApi

on:
  pull_request:
    branches: [main, dev, development]
    paths: [src/WebApi/**, src/SharedKernel/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ShinySniffle.sln

      - name: Build WebApi
        run: dotnet build src/WebApi/WebApi.csproj --configuration Release --no-restore
