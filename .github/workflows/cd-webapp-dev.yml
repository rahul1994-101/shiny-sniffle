name: CD - WebApp (Dev)

on:
  workflow_run:
    workflows: ["CI - WebApp"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJson('["dev", "development"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-latest
    environment: dev

    env:
      # ARTIFACT_NAME: WebApp-${{ github.run_id }}
      ARTIFACT_NAME: WebApp-latest
      ARTIFACT_PATH: ./artifacts/WebApp

    steps:
      - name: Download artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}

      - name: Validate artifact content
        run: |
          if [ ! -d "${{ env.ARTIFACT_PATH }}" ] || [ -z "$(ls -A ${{ env.ARTIFACT_PATH }})" ]; then
            echo "❌ Artifact not found or is empty."
            exit 1
          fi

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: sniffle-webapp-dev
          publish-profile: ${{ secrets.WEBAPP_DEV_PUBLISH_PROFILE }}
          package: ${{ env.ARTIFACT_PATH }}
