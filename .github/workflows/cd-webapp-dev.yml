name: CD - WebApp (Dev)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - WebApp"]
    types:
      - completed

jobs:
  deploy-dev:
    if: ${{((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||  github.event_name == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'development'}}
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARTIFACT_NAME: WebApp-latest
      ARTIFACT_PATH: ./artifacts/WebApp
      ARTIFACT_ZIP: ./artifacts/WebApp/WebApp.zip  # If you are zipping the output

    steps:
      # Checkout source code (For Vendoring)
      - name: Checkout source code
        uses: actions/checkout@v4

      # Download artifact
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v4
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          run_id:  ${{ github.event.workflow_run.id }}
          name:    ${{ env.ARTIFACT_NAME }}
          path:    ${{ env.ARTIFACT_PATH }}
          if_no_artifact_found: fail

      # Validate artifact content
      - name: Validate artifact content
        # run: |
        #   if [ ! -d "${{ env.ARTIFACT_PATH }}" ] || [ -z "$(ls -A ${{ env.ARTIFACT_PATH }})" ]; then
        #     echo "❌ Artifact not found or is empty."
        #     exit 1
        #   fi
        run: |
          if [ ! -f "${{ env.ARTIFACT_ZIP }}" ]; then
            echo "❌ WebApp.zip not found!"
            exit 1
          fi

      # Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        # uses: azure/webapps-deploy@v2
        uses: ./.github/actions/webapps-deploy/3.0.6
        with:
          app-name: sniffle-webapp-dev
          publish-profile: ${{ secrets.WEBAPP_DEV_PUBLISH_PROFILE }}
          # package: ${{ env.ARTIFACT_PATH }}
          package: ${{ env.ARTIFACT_ZIP }}  # If you are zipping the output

  deploy-stg:
    if: ${{((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||  github.event_name == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'development'}}
    runs-on: ubuntu-latest
    environment: stg
    needs: deploy-dev

    env:
      ARTIFACT_NAME: WebApp-latest
      ARTIFACT_PATH: ./artifacts/WebApp
      ARTIFACT_ZIP: ./artifacts/WebApp/WebApp.zip  # If you are zipping the output

    steps:
      # Checkout source code (For Vendoring)
      - name: Checkout source code
        uses: actions/checkout@v4

      # Download artifact
      - name: Download artifact
        uses: dawidd6/action-download-artifact@v4
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          run_id:  ${{ github.event.workflow_run.id }}
          name:    ${{ env.ARTIFACT_NAME }}
          path:    ${{ env.ARTIFACT_PATH }}
          if_no_artifact_found: fail

      # Validate artifact content
      - name: Validate artifact content
        # run: |
        #   if [ ! -d "${{ env.ARTIFACT_PATH }}" ] || [ -z "$(ls -A ${{ env.ARTIFACT_PATH }})" ]; then
        #     echo "❌ Artifact not found or is empty."
        #     exit 1
        #   fi
        run: |
          if [ ! -f "${{ env.ARTIFACT_ZIP }}" ]; then
            echo "❌ WebApp.zip not found!"
            exit 1
          fi

      # Deploy to Azure WebApp
      - name: Deploy to Azure WebApp
        # uses: azure/webapps-deploy@v2
        uses: ./.github/actions/webapps-deploy/3.0.6
        with:
          app-name: sniffle-webapp-stg
          publish-profile: ${{ secrets.WEBAPP_STG_PUBLISH_PROFILE }}
          # package: ${{ env.ARTIFACT_PATH }}
          package: ${{ env.ARTIFACT_ZIP }}  # If you are zipping the output
