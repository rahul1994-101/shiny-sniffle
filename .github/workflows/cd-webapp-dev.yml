name: CD – WebApp (Dev)

on:
  push:
    branches: [dev, development]
    paths: [src/WebApp/**, src/SharedKernel/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish WebApp
        run: dotnet publish src/WebApp/WebApp.csproj --configuration Release --output ./publish

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: sniffle-webapp-dev
          publish-profile: ${{ secrets.WEBAPP_DEV_PUBLISH_PROFILE }}
          package: ./publish
