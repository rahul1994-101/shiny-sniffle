name: CI - Web Projects

on:
  pull_request:
    branches: [main, dev, development]
    paths: [src/WebApp/**, src/WebApi/**, src/SharedKernel/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ShinySniffle.sln

      # Determine which project has changes
      - name: Determine changed project
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webapp:
              - 'src/WebApp/**'
              - 'src/SharedKernel/**'
            webapi:
              - 'src/WebApi/**'
              - 'src/SharedKernel/**'

      # Build projects based on changes
      - name: Build WebApp
        if: steps.changes.outputs.webapp == 'true'
        run: dotnet build src/WebApp/WebApp.csproj --configuration Release --no-restore

      - name: Build WebApi
        if: steps.changes.outputs.webapi == 'true'
        run: dotnet build src/WebApi/WebApi.csproj --configuration Release --no-restore

      - name: No changes detected
        if: steps.changes.outputs.webapp != 'true' && steps.changes.outputs.webapi != 'true'
        run: echo "No changes detected. Skipping build."
