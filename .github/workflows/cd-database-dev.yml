name: CD – Database (Dev)

on:
  push:
    branches: [dev, development]
    paths: [src/Database/**]

jobs:
  deploy:
    runs-on: windows-latest  # Required for sqlproj builds
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQL Project
        run: msbuild src/Database/Database.sqlproj /p:Configuration=Release

      - name: Deploy DACPAC to Azure SQL
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:"src/Database/bin/Release/Database.dacpac" \
            /TargetConnectionString:"${{ secrets.SQL_DEV_CONNECTION_STRING }}" \
            /p:BlockOnPossibleDataLoss=false
