name: ci-webapp

on:
  push:
    branches: [main, dev, development, workflow]
    # paths: [src/WebApp/**, src/SharedKernel/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore ShinySniffle.sln

      # Build project
      - name: Build WebApp
        run: dotnet build src/WebApp/WebApp.csproj --configuration Release --no-restore

      # Publish project
      - name: Publish WebApp
        run: dotnet publish src/WebApp/WebApp.csproj --configuration Release --output ./artifacts/WebApp

      # Zip published project
      - name: Zip published project
        run: zip -r WebApp.zip ./*
        working-directory: ./artifacts/WebApp

      # Upload artifact
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WebApp-latest
          # path: ./artifacts/WebApp
          # path: ./artifacts/WebApp/WebApp.zip  # If you are zipping the output
          path: ${{github.workspace}}/WebApp
          compression-level: 6  #  0 (no compression) to 9 (max)
          if-no-files-found: error

