name: CD – WebApi (Dev)

on:
  push:
    branches: [dev, development]
    paths: [src/WebApi/**, src/SharedKernel/**]

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download artifact from CI
        uses: actions/download-artifact@v4
        with:
          # name: WebApi-${{ github.sha }}
          name: WebApi-latest
          path: ./artifact/WebApi

      - name: Validate artifact content
        run: |
          if [ ! -d "./artifact/WebApi" ] || [ -z "$(ls -A ./artifact/WebApi)" ]; then
            echo "❌ Artifact not found or is empty."
            exit 1
          fi

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: sniffle-webapi-dev
          publish-profile: ${{ secrets.WEBAPI_DEV_PUBLISH_PROFILE }}
          package: ./artifact/WebApi
